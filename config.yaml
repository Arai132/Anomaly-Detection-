data:
  raw_path: data/raw
  processed_path: data/processed
  test_size: 0.2
  random_state: 42

detectors:
  isolation_forest:
    n_estimators: 100
    contamination: 0.05
    random_state: 42
    n_jobs: -1
  lof:
    n_neighbors: 20
    contamination: 0.05
    n_jobs: -1
  zscore:
    threshold: 3.0
  iqr:
    multiplier: 1.5
  autoencoder:
    encoding_dim: 16
    hidden_dim: null
    epochs: 50
    batch_size: 32
    lr: 0.001
    threshold_percentile: 95
    device: auto
  vae:
    latent_dim: 16
    hidden_dim: null
    epochs: 50
    batch_size: 32
    lr: 0.001
    beta: 1.0
    threshold_percentile: 95
    device: auto
  gaussian:
    n_components: 1
    covariance_type: full
    threshold_percentile: 95
  ensemble_stacking:
    threshold_percentile: 95
  elliptic_envelope:
    contamination: 0.05
    support_fraction: null
    random_state: 42
  one_class_svm:
    kernel: rbf
    nu: 0.05
    gamma: scale
  sgd_one_class_svm:
    nu: 0.05
    gamma: scale
    n_components: 100
    random_state: 42
  pca:
    n_components: 0.95
    threshold_percentile: 95

fraud_benchmark:
  max_train_samples: 80000
  test_size: 0.3
  random_state: 42

semi_supervised:
  label_fraction: 0.1
  anomaly_percentile: 90
  normal_percentile: 20
  max_iters: 3

evaluation:
  metrics:
    - precision
    - recall
    - f1
    - roc_auc
  plots: true

models:
  save_path: models/
